<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // এখানে আপনার লুকানো ইনস্টল বাটনটি দৃশ্যমান করুন
});

// আপনার কাস্টম বাটনের অনক্লিক ফাংশন
function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        console.log('User accepted the install prompt');
      }
      deferredPrompt = null;
    });
  }
}
    
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js")
      .then(() => console.log("Service Worker Registered"))
      .catch((err) => console.log("Service Worker Failed", err));
  }
  </script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>WeatherGlobe — Global Weather</title>
  <meta name="description" content="Check current weather and forecasts for cities around the world with WeatherGlobe.">
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121d30;
      --panel-2: #1a2940;
      --text: #f4f7fb;
      --muted: #a8b5c8;
      --accent: #62c8ff;
      --line: rgba(255,255,255,.1);
      --danger: #ff8585;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 14px 36px;
      color: var(--text);
      background: radial-gradient(circle at top, #1b3656 0, var(--bg) 48%);
      font-family: Arial, Helvetica, sans-serif;
    }
    .app { width: 100%; max-width: 760px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .brand { font-size: 23px; font-weight: 800; letter-spacing: .2px; }
    .brand span { color: var(--accent); }
    .tagline { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .search { display: flex; gap: 8px; margin-bottom: 18px; }
    input {
      min-width: 0; flex: 1; padding: 14px 15px; border: 1px solid var(--line);
      border-radius: 13px; background: var(--panel); color: var(--text); font-size: 16px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      border: 0; border-radius: 12px; padding: 0 17px; color: #061321; background: var(--accent);
      font-weight: 700; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .location-btn { width: 100%; padding: 12px; margin-bottom: 18px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
    .status { color: var(--muted); text-align: center; min-height: 22px; font-size: 14px; margin: 8px 0 14px; }
    .error { color: var(--danger); }
    .card { background: rgba(18,29,48,.94); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 12px 35px rgba(0,0,0,.16); }
    .current-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .place { font-size: 21px; font-weight: 700; }
    .localtime { color: var(--muted); font-size: 13px; margin-top: 5px; }
    .condition-icon { width: 88px; height: 88px; object-fit: contain; }
    .temperature { font-size: clamp(56px, 14vw, 78px); font-weight: 300; line-height: 1; margin: 10px 0; }
    .condition { color: var(--muted); font-size: 16px; }
    .details { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-top: 20px; }
    .detail { background: var(--panel-2); padding: 13px; border-radius: 13px; }
    .detail small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .detail strong { font-size: 16px; }
    h2 { font-size: 18px; margin: 0 0 14px; }
    .forecast { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
    .day { text-align: center; background: var(--panel-2); border-radius: 14px; padding: 12px 5px; }
    .day .dayname { color: var(--muted); font-size: 12px; }
    .day img { width: 48px; height: 48px; }
    .day strong { display: block; font-size: 15px; }
    .day span { color: var(--muted); font-size: 12px; }
    .hourly { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .hour { flex: 0 0 76px; text-align: center; background: var(--panel-2); border-radius: 13px; padding: 11px 5px; }
    .hour small { color: var(--muted); }
    .hour img { width: 42px; height: 42px; }
    .hour strong { display: block; }
    footer { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; padding: 8px 12px; }
    footer a { color: var(--accent); }
    .hidden { display: none; }
    @media (max-width: 390px) {
      body { padding-left: 10px; padding-right: 10px; }
      .card { padding: 15px; }
      .brand { font-size: 20px; }
      button { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <button id="installBtn" onclick="installApp()" style="display:none;">অ্যাপ ইনস্টল করুন</button>
  
  <main class="app">
    <header>
      <div>
        <div class="brand">Weather<span>Globe</span> 🌍</div>
        <div class="tagline">Weather updates around the world</div>
      </div>
    </header>

    <form class="search" id="searchForm">
      <input id="cityInput" type="search" placeholder="Search city, e.g. London" aria-label="Search city" required>
      <button id="searchButton" type="submit">Search</button>
    </form>
    <button class="location-btn" id="locationButton" type="button">◎ Use my current location</button>
    <div class="status" id="status" role="status">Enter a city to see its weather.</div>

    <section id="weatherArea" class="hidden" aria-live="polite">
      <div class="card">
        <div class="current-top">
          <div>
            <div class="place" id="place">—</div>
            <div class="localtime" id="localtime">—</div>
          </div>
          <img class="condition-icon" id="conditionIcon" alt="Weather condition">
        </div>
        <div class="temperature" id="temperature">—°</div>
        <div class="condition" id="condition">—</div>
        <div class="details">
          <div class="detail"><small>Feels like</small><strong id="feels">—</strong></div>
          <div class="detail"><small>Humidity</small><strong id="humidity">—</strong></div>
          <div class="detail"><small>Wind</small><strong id="wind">—</strong></div>
          <div class="detail"><small>UV index</small><strong id="uv">—</strong></div>
        </div>
      </div>

      <div class="card">
        <h2>Hourly forecast</h2>
        <div class="hourly" id="hourly"></div>
      </div>

      <div class="card">
        <h2>3-day forecast</h2>
        <div class="forecast" id="forecast"></div>
      </div>
    </section>

    <footer>
      Weather information provided by <a href="https://www.weatherapi.com/" target="_blank" rel="noopener">WeatherAPI.com</a>.<br>
      Forecasts are informational and should not replace official emergency weather alerts.
    </footer>
  </main>

  <script>
    // STEP 1: Replace PASTE_YOUR_API_KEY_HERE with your WeatherAPI key.
    const API_KEY = "299298aa948c4f0d90911949260911";
    const BASE_URL = "https://api.weatherapi.com/v1/forecast.json";

    const statusBox = document.getElementById("status");
    const weatherArea = document.getElementById("weatherArea");
    const searchButton = document.getElementById("searchButton");

    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.className = isError ? "status error" : "status";
    }

    function iconUrl(path) {
      return path.startsWith("//") ? "https:" + path : path;
    }

    function formatHour(timeText) {
      return timeText.split(" ")[1] || timeText;
    }

    async function loadWeather(query) {
      if (API_KEY === "PASTE_YOUR_API_KEY_HERE") {
        showStatus("প্রথমে কোডে আপনার WeatherAPI key বসাতে হবে।", true);
        return;
      }

      searchButton.disabled = true;
      showStatus("Loading weather...");
      try {
        const url = `${BASE_URL}?key=${encodeURIComponent(API_KEY)}&q=${encodeURIComponent(query)}&days=3&aqi=no&alerts=no`;
        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "Weather data could not be loaded.");
        }

        showWeather(data);
        weatherArea.classList.remove("hidden");
        showStatus("Weather updated successfully.");
      } catch (error) {
        showStatus(error.message || "Something went wrong. Please try again.", true);
      } finally {
        searchButton.disabled = false;
      }
    }

    function showWeather(data) {
      const current = data.current;
      const location = data.location;
      document.getElementById("place").textContent = `${location.name}, ${location.country}`;
      document.getElementById("localtime").textContent = `Local time: ${location.localtime}`;
      document.getElementById("conditionIcon").src = iconUrl(current.condition.icon);
      document.getElementById("conditionIcon").alt = current.condition.text;
      document.getElementById("temperature").textContent = `${Math.round(current.temp_c)}°C`;
      document.getElementById("condition").textContent = current.condition.text;
      document.getElementById("feels").textContent = `${Math.round(current.feelslike_c)}°C`;
      document.getElementById("humidity").textContent = `${current.humidity}%`;
      document.getElementById("wind").textContent = `${current.wind_kph} km/h`;
      document.getElementById("uv").textContent = current.uv;

      const hours = data.forecast.forecastday[0].hour;
      const now = new Date(location.localtime.replace(" ", "T"));
      const nextHours = hours.filter(item => new Date(item.time.replace(" ", "T")) >= now).slice(0, 8);
      document.getElementById("hourly").innerHTML = nextHours.map(item => `
        <div class="hour">
          <small>${formatHour(item.time)}</small>
          <img src="${iconUrl(item.condition.icon)}" alt="">
          <strong>${Math.round(item.temp_c)}°</strong>
          <small>${item.chance_of_rain}% rain</small>
        </div>
      `).join("");

      document.getElementById("forecast").innerHTML = data.forecast.forecastday.map(day => `
        <div class="day">
          <div class="dayname">${new Date(day.date + "T12:00:00").toLocaleDateString("en", { weekday: "short" })}</div>
          <img src="${iconUrl(day.day.condition.icon)}" alt="">
          <strong>${Math.round(day.day.maxtemp_c)}° / ${Math.round(day.day.mintemp_c)}°</strong>
          <span>${day.day.daily_chance_of_rain}% rain</span>
        </div>
      `).join("");
    }

    // ফর্ম সাবমিট হ্যান্ডেল করার জন্য
    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const query = document.getElementById("cityInput").value.trim();
      if (query) {
        loadWeather(query);
      }
    });

    // বর্তমান লোকেশন বাটন হ্যান্ডেল করার জন্য
    document.getElementById("locationButton").addEventListener("click", () => {
      if (!navigator.geolocation) {
        showStatus("Geolocation is not supported by your browser", true);
        return;
      }
      showStatus("Locating...");
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latLon = `${position.coords.latitude},${position.coords.longitude}`;
          loadWeather(latLon);
        },
        () => {
          showStatus("Unable to retrieve your location", true);
        }
      );
    });
  </script>
</body>
</html>
